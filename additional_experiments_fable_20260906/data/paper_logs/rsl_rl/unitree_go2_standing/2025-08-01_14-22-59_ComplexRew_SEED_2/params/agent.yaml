seed: 2
device: cuda:0
num_steps_per_env: 24
max_iterations: 1800
empirical_normalization: false
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  actor_hidden_dims:
  - 256
  - 256
  - 256
  critic_hidden_dims:
  - 256
  - 256
  - 256
  activation: elu
  vel_dependent_actor_latent_dim: 0
algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.0
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
save_interval: 249
experiment_name: unitree_go2_standing
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
runner_class: rsl_rl.runners.on_policy_runner:OnPolicyRunner
amp_replay_buffer_size: {}
